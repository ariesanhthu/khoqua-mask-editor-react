# Vercel Git integration deploys this repository automatically.
# Keep quality checks here; do not run a second deploy requiring unset Vercel secrets.
name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: annotation-tool
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: annotation-tool/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint application
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Build application
        run: npm run build
